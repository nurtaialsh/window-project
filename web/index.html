<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shard solver</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #000000; --raise: #151515; --line: rgba(255, 255, 255, .12); --line-strong: rgba(255, 255, 255, .28);
    --text: #f2f2f2; --muted: #8e8e8e; --faint: #5e5e5e;
    --accent: #f2f2f2; --good: #ffffff; --bad: #bdbdbd;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); text-transform: lowercase;
         -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(255, 255, 255, .25); }


  main { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 330px 1fr; gap: 56px;
         padding: 34px 40px 64px; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; gap: 36px; padding: 26px 16px 48px; }
      }


  #drop { border: 1px dashed var(--line-strong); padding: 34px 18px; text-align: center; cursor: pointer;
          font: 16px/1.45 var(--sans); color: var(--muted); transition: border-color .2s, color .2s, background .2s; }
  #drop:hover, #drop.over { border-color: var(--accent); color: var(--text); background: rgba(255, 255, 255, .03); }
  #drop input { display: none; }
  #picker { display: none; margin-top: 18px; }
  #pickwrap { position: relative; line-height: 0; }
  #pickwrap img { width: 100%; }
  .box { position: absolute; border: 1px solid rgba(255, 255, 255, .4); cursor: pointer; transition: background .15s, border-color .15s; }
  .box:hover { border-color: var(--text); background: rgba(255, 255, 255, .08); }
  .box.sel { border: 1.5px solid #fff; background: rgba(255, 255, 255, .16); }
  .link { background: none; border: 0; padding: 0; margin-top: 8px; font: 13px var(--sans); color: var(--muted);
          letter-spacing: 0; text-transform: none;
          cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .link:hover { color: var(--text); }
  .link.sel { color: var(--accent); text-decoration-color: var(--accent); }

  .field { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 14px; margin: 0 0 16px; }
  .field > label { color: var(--muted); font-size: 12.5px; }
  .field output { font: 20px var(--sans); min-width: 2ch; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px 14px; grid-column: 2 / 4; }
  .seg button { background: none; border: 0; padding: 2px 0; color: var(--muted);
                border-bottom: 1px solid transparent; font-size: 13px; }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: var(--text); border-bottom-color: var(--text); }
  .check { display: flex; gap: 10px; align-items: center; margin: 4px 0 22px; color: var(--text); cursor: pointer; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }

  .actions { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  button { font: 400 14px var(--sans); letter-spacing: .02em; cursor: pointer; }
  .primary { background: transparent; color: var(--text); border: 1px solid var(--text); padding: 12px 20px;
             transition: background .2s; }
  .primary:hover:not(:disabled) { background: #f2f2f2; color: #0b0b0b; }
  .quiet { background: none; border: 0; padding: 12px 0; color: var(--muted); }
  .quiet:hover:not(:disabled) { color: var(--text); }
  .quiet.on { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
  button:disabled { opacity: .35; cursor: default; }
  #err { color: var(--bad); margin-top: 14px; white-space: pre-wrap; font-size: 13px; }

  #stagewrap { max-width: 780px; margin: 0 auto; }
  canvas { width: 100%; max-width: 780px; aspect-ratio: 1; display: block; margin: 0 auto; }
  #drop, #picker { margin-bottom: 26px; }
  #steps { display: flex; justify-content: center; gap: 28px; margin: 12px 0 0; flex-wrap: wrap; }
  #steps button { padding: 6px 0; }
  #stats { max-width: 780px; margin: 30px auto 0; display: grid; grid-template-columns: repeat(3, 1fr);
           border-top: 1px solid var(--line); }
  #stats[hidden] { display: none; }
  #all { max-width: 780px; margin: 26px auto 0; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  #all[hidden] { display: none; }
  #all figure { margin: 0; cursor: pointer; text-align: center; color: var(--muted); font-size: 12px; }
  #all canvas { width: 100%; aspect-ratio: 1; display: block; outline: 1px solid transparent; }
  #all figure.auto canvas { outline-color: var(--line-strong); }
  #all figure.on canvas { outline: 1px solid var(--text); }
  #all figure.on { color: var(--text); }
  @media (max-width: 600px) { #all { grid-template-columns: repeat(4, 1fr); } }
  .stat { padding: 18px 8px 0; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font: 300 34px/1.1 var(--sans); }
  .stat span { display: block; margin-top: 6px; font-size: 13px; letter-spacing: .02em; color: var(--muted); }
  @media (max-width: 520px) { .stat b { font-size: 26px; } #steps { gap: 18px; } }
</style>
</head>
<body>
<main>
  <section>
    <div id="drop"><input id="file" type="file" accept="image/*">image</div>
    <div id="picker">
      <div id="pickwrap"><img id="pickimg" alt=""></div>
      <button class="link" id="whole">whole image</button>
    </div>
    <div class="field"><label for="pieces">shards</label>
      <input id="pieces" type="range" min="6" max="48" value="12"><output id="piecesv">12</output></div>
    <div class="field"><label>model</label>
      <div class="seg" id="models" role="radiogroup"></div></div>
    <div class="field"><label>cracks</label>
      <div class="seg" id="lead" role="radiogroup">
        <button type="button" data-v="0">random</button>
        <button type="button" data-v="1">lead v1</button>
        <button type="button" data-v="2" class="on">lead v2</button>
      </div></div>
    <div class="actions">
      <button id="go" class="primary" disabled>solve</button>
      <button id="again" class="quiet" disabled>again</button>
    </div>
    <div id="err"></div>
  </section>
  <section>
    <canvas id="stage" width="760" height="760"></canvas>
    <div id="steps">
      <button class="quiet" id="replay" disabled>replay</button>
      <button class="quiet" id="mistakes" disabled>mistakes</button>
      <button class="quiet" id="peek" disabled>original</button>
      <button class="quiet" id="cracksbtn">cracks</button>
      <button class="quiet" id="allbtn" disabled>all</button>
    </div>
    <div id="all" hidden></div>
    <div id="stats" hidden>
      <div class="stat"><b id="s1">–</b><span>placed</span></div>
      <div class="stat"><b id="s2">–</b><span>turn error</span></div>
      <div class="stat"><b id="s3">–</b><span>within 15°</span></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const cv = $("stage"), ctx = cv.getContext("2d");
let srcImg = null, srcBlobUrl = null, panes = [], selected = null, result = null;
let sprites = [], layers = {}, anim = null, showWrong = false, peeking = false;

// ── upload & pane picking ─────────────────────────────────────
const drop = $("drop");
drop.onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0] && load(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over");
                     e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); };

async function load(file) {
  $("err").textContent = "";
  if (srcBlobUrl) URL.revokeObjectURL(srcBlobUrl);
  srcBlobUrl = URL.createObjectURL(file);
  srcImg = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im);
                                            im.onerror = bad; im.src = srcBlobUrl; });
  $("pickimg").src = srcBlobUrl;
  $("picker").style.display = "block";
  document.querySelectorAll(".box").forEach(b => b.remove());
  select(null);
  $("go").disabled = false;
  try {
    const r = await post("/api/panes", file);
    panes = r.panes;
    const wrap = $("pickwrap");
    panes.forEach((p, i) => {
      const b = document.createElement("div");
      b.className = "box";
      Object.assign(b.style, { left: 100 * p.x / r.width + "%", top: 100 * p.y / r.height + "%",
                               width: 100 * p.w / r.width + "%", height: 100 * p.h / r.height + "%" });
      b.onclick = () => select(i);
      wrap.appendChild(b);
    });
    if (panes.length > 1) select(0);
  } catch (e) { /* no panes found: the whole image is used */ }
}

function select(i) {
  selected = i;
  document.querySelectorAll(".box").forEach((b, j) => b.classList.toggle("sel", j === i));
  $("whole").classList.toggle("sel", i === null);
}
$("whole").onclick = () => select(null);

async function paneBlob() {
  const p = selected === null ? { x: 0, y: 0, w: srcImg.naturalWidth, h: srcImg.naturalHeight } : panes[selected];
  const c = document.createElement("canvas");
  c.width = p.w; c.height = p.h;
  c.getContext("2d").drawImage(srcImg, p.x, p.y, p.w, p.h, 0, 0, p.w, p.h);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.92));
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", body });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

// ── solving ───────────────────────────────────────────────────
$("pieces").oninput = e => $("piecesv").textContent = e.target.value;
let leadMode = "2";
document.querySelectorAll("#lead button").forEach(b => b.onclick = () => {
  leadMode = b.dataset.v;
  document.querySelectorAll("#lead button").forEach(x => x.classList.toggle("on", x === b));
});
$("go").onclick = () => solve();
$("again").onclick = () => solve();

// ── model versions: switching after a solve re-solves the *same* break ──
let models = [], modelId = null, lastSeed = null;
async function loadModels() {
  const r = await (await fetch("/api/models")).json();
  models = r.models;
  const box = $("models");
  box.innerHTML = "";
  for (const m of models) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = m.label; b.dataset.id = m.id;
    b.onclick = () => { pickModel(m.id); if (result) solve(true); };
    box.appendChild(b);
  }
  pickModel(r.default);
}
function pickModel(id) {
  modelId = id;
  document.querySelectorAll("#models button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
}
loadModels();

async function solve(sameBreak = false) {
  if (!srcImg) return;
  $("err").textContent = "";
  $("go").disabled = $("again").disabled = true;
  try {
    const q = new URLSearchParams({ pieces: $("pieces").value, lead: leadMode, model: modelId });
    if (sameBreak && lastSeed !== null) q.set("seed", lastSeed);
    result = await post("/api/solve?" + q, await paneBlob());
    lastSeed = result.seed;
    await prepare(result);
    showStats(result);
    play();
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("go").disabled = $("again").disabled = false;
  }
}

const loadImg = src => new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; });

async function prepare(r) {
  const [image, cracks, wrong] = await Promise.all([r.image, r.cracks, r.wrong].map(loadImg));
  layers = { image, cracks, wrong };
  const imgs = await Promise.all(r.shards.map(s => loadImg(s.png)));
  const n = r.shards.length, cols = Math.ceil(Math.sqrt(n)), cell = r.size / cols;
  const order = [...Array(n).keys()].sort(() => Math.random() - .5);
  sprites = r.shards.map((s, i) => {
    const k = order.indexOf(i);
    const jitter = () => (Math.random() - .5) * cell * .25;
    return { img: imgs[i], s,
      home:    [s.home[0], s.home[1], s.angle],
      scatter: [(k % cols + .5) * cell + jitter(), (Math.floor(k / cols) + .5) * cell + jitter(), 0],
      hole:    [s.hole[0], s.hole[1], s.pred_angle] };
  });
  ["replay", "mistakes", "peek", "allbtn"].forEach(id => $(id).disabled = false);
  wrongImgs = await Promise.all(r.candidates.map(c => loadImg(c.wrong)));
  current = r.best;
  buildAll();
}

// ── all 16 attempts: previews; clicking one makes it the result ──
let wrongImgs = [], current = 0;
function drawAttempt(c2, cand) {
  const D = result.size, s = c2.width / (D + 2 * M), x = c2.getContext("2d");
  x.setTransform(s, 0, 0, s, 0, 0);
  x.fillStyle = "#000"; x.fillRect(0, 0, D + 2 * M, D + 2 * M);
  sprites.forEach((sp, j) => {
    const w = sp.img.width;
    x.save(); x.translate(M + cand.holes[j][0], M + cand.holes[j][1]); x.rotate(cand.pred_angle[j]);
    x.drawImage(sp.img, -w / 2, -w / 2, w, w); x.restore();
  });
}
function buildAll() {
  const box = $("all");
  box.innerHTML = "";
  result.candidates.forEach((cand, i) => {
    const f = document.createElement("figure");
    f.className = (i === result.best ? "auto " : "") + (i === current ? "on" : "");
    const c2 = document.createElement("canvas");
    c2.width = c2.height = 200;
    f.appendChild(c2);
    f.appendChild(Object.assign(document.createElement("figcaption"), { textContent: `${cand.correct}/${result.total}` }));
    f.onclick = () => useAttempt(i);
    box.appendChild(f);
    drawAttempt(c2, cand);
  });
}
function useAttempt(i) {
  current = i;
  const cand = result.candidates[i];
  sprites.forEach((sp, j) => sp.hole = [cand.holes[j][0], cand.holes[j][1], cand.pred_angle[j]]);
  layers.wrong = wrongImgs[i];
  showStats({ correct: cand.correct, total: result.total, rot_median: cand.rot_median,
              rot_within_15: cand.rot_within_15 });
  document.querySelectorAll("#all figure").forEach((f, j) => f.classList.toggle("on", j === i));
  play();
}

function showStats(r) {
  $("stats").hidden = false;
  $("s1").textContent = `${r.correct} / ${r.total}`;
  $("s1").style.color = r.correct === r.total ? "var(--good)" : "";
  $("s2").textContent = `${Math.round(r.rot_median)}°`;
  $("s3").textContent = `${Math.round(100 * r.rot_within_15)}%`;
}

// ── drawing & animation ───────────────────────────────────────
const M = 70;                     // margin so misplaced shards that stick out stay visible
function fit() {
  const d = (result ? result.size : 576) + 2 * M, dpr = window.devicePixelRatio || 1;
  cv.width = cv.height = Math.round(d * dpr);
  ctx.setTransform(cv.width / d, 0, 0, cv.height / d, 0, 0);
}

const ease = t => (1 - Math.cos(Math.PI * t)) / 2;   // gentle sine in-out, no snap
function lerpPose(a, b, t) {
  let d = b[2] - a[2];
  d = Math.atan2(Math.sin(d), Math.cos(d));          // turn the short way round
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + d * t];
}

function drawSprite(sp, pose) {
  const w = sp.img.width;          // the png is already at display scale
  ctx.save();
  ctx.translate(M + pose[0], M + pose[1]);
  ctx.rotate(pose[2]);             // png was turned by -angle; turning by +angle undoes it
  ctx.drawImage(sp.img, -w / 2, -w / 2, w, w);
  ctx.restore();
}

// optional intro: the intact pane with its crack lines, then the burst into the scatter
function intro(t, burst) {
  const D = result.size;
  ctx.clearRect(0, 0, D + 2 * M, D + 2 * M);
  if (!burst) {
    ctx.drawImage(layers.image, M, M, D, D);
    ctx.drawImage(layers.cracks, M, M, D, D);
    return;
  }
  const e = ease(t);
  sprites.forEach(sp => drawSprite(sp, lerpPose(sp.home, sp.scatter, e)));
}

// t = 0: shards scattered; t = 1: shards in the holes the network chose
function frame(t) {
  const D = result.size;
  ctx.clearRect(0, 0, D + 2 * M, D + 2 * M);
  if (peeking) { ctx.drawImage(layers.image, M, M, D, D); return; }
  ctx.fillStyle = "#000000";
  ctx.fillRect(M, M, D, D);
  const e = ease(t);
  sprites.forEach(sp => drawSprite(sp, lerpPose(sp.scatter, sp.hole, e)));
  if (t >= 1 && showWrong) ctx.drawImage(layers.wrong, M, M, D, D);
}

function play() {
  cancelAnimationFrame(anim);
  fit();
  const hold = showCracks ? 900 : 0, burst = showCracks ? 400 : 0, dur = 700;
  const t0 = performance.now();
  const tick = now => {
    const el = now - t0;
    if (el < hold) intro(0, false);
    else if (el < hold + burst) intro((el - hold) / burst, true);
    else frame(Math.min(1, (el - hold - burst) / dur));
    if (el < hold + burst + dur) anim = requestAnimationFrame(tick);
    else frame(1);
  };
  anim = requestAnimationFrame(tick);
}

$("replay").onclick = () => result && play();
$("allbtn").onclick = () => {
  $("all").hidden = !$("all").hidden;
  $("allbtn").classList.toggle("on", !$("all").hidden);
};
let showCracks = false;
$("cracksbtn").onclick = () => { showCracks = !showCracks; $("cracksbtn").classList.toggle("on", showCracks); };
$("mistakes").onclick = () => {
  showWrong = !showWrong;
  $("mistakes").textContent = showWrong ? "Hide mistakes" : "Show mistakes";
  if (result) frame(1);
};
const peek = on => { if (!result) return; peeking = on; frame(1); };
$("peek").onpointerdown = () => peek(true);
["pointerup", "pointerleave"].forEach(ev => $("peek").addEventListener(ev, () => peeking && peek(false)));

// placeholder so the stage isn't an empty black square
(function idle() {
  const d = 576 + 2 * M; cv.width = cv.height = d;
  ctx.strokeStyle = "rgba(255, 255, 255, .12)"; ctx.setLineDash([4, 6]);
  ctx.strokeRect(M + .5, M + .5, 576 - 1, 576 - 1);

})();
</script>
</body>
</html>
